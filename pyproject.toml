[project]
name = "agent-memory-py"
version = "0.1.0"
description = "Typed Python client + CLI for the agent-memory MCP server, plus a Claude Code plugin."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Rzemieniuk" }]
requires-python = ">=3.12"
keywords = ["mcp", "memory", "recall", "pgvector", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["mcp>=2.1,<3"]

[project.urls]
Repository = "https://github.com/rzem-ai/agent-memory-py"

[project.scripts]
agent-memory-py = "agent_memory.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "anyio>=4.5",
  "ruff>=0.9",
  "mypy>=1.14",
  "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/agent_memory", "plugin", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:agent_memory"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"src/agent_memory/cli/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
